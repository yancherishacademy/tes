<script>
/* =====================================================================
 * MESIN ANIMASI — menggambar adegan, karakter, dialog, musik & rekaman
 * ===================================================================== */
(function (global) {
  const W = 960, H = 540, GROUND = H * 0.8;
  const SKY = { day: ['#86C5EE', '#DDF1FF'], morning: ['#F7C29F', '#FFF1DB'], dusk: ['#6B5A9C', '#F6A68A'], night: ['#0D1932', '#2A3F6B'] };
  const SKINS = ['#F7D2B0', '#E3AE84', '#C68B59', '#8D5A3B', '#FBE0CB'];
  const HAIR = ['#3B2A20', '#1E1E24', '#7A4B2A', '#C9813A', '#4A3426', '#2D2433'];
  const TAU = Math.PI * 2;

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function readTime(text) { const w = String(text || '').trim().split(/\s+/).filter(Boolean).length; return Math.min(14, Math.max(2.2, 1.2 + w * 0.42)); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const f = c => clamp(Math.round(c + amt * 255), 0, 255);
    return '#' + [f(n >> 16), f(n >> 8 & 255), f(n & 255)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function wrap(ctx, text, maxW) {
    const words = String(text).split(/\s+/); const lines = []; let cur = '';
    words.forEach(w => { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; });
    if (cur) lines.push(cur);
    return lines;
  }
  function ellipse(ctx, x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
  function heart(ctx, x, y, s, fill) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath();
    ctx.moveTo(0, 4); ctx.bezierCurveTo(-10, -4, -6, -12, 0, -6); ctx.bezierCurveTo(6, -12, 10, -4, 0, 4);
    ctx.fillStyle = fill; ctx.fill(); ctx.restore();
  }

  /* ----------------------------- LATAR ----------------------------- */
  function drawSky(ctx, time, t) {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, SKY[time][0]); g.addColorStop(1, SKY[time][1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (time === 'night') {
      const r = rng(7);
      for (let i = 0; i < 70; i++) { const a = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.5 + i)); ctx.fillStyle = `rgba(255,255,240,${a})`; ctx.fillRect(r() * W, r() * GROUND * 0.7, 2, 2); }
      ellipse(ctx, W * 0.8, 95, 34, 34, '#FFF6D5'); ellipse(ctx, W * 0.8 + 14, 87, 30, 30, SKY.night[0]);
    } else {
      const pos = { day: [W * 0.82, 90, '#FFE48A'], morning: [W * 0.15, 165, '#FFD27A'], dusk: [W * 0.78, GROUND - 60, '#FF9E6B'] }[time];
      const glow = ctx.createRadialGradient(pos[0], pos[1], 10, pos[0], pos[1], 110);
      glow.addColorStop(0, 'rgba(255,240,200,.8)'); glow.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.fillStyle = glow; ctx.fillRect(pos[0] - 110, pos[1] - 110, 220, 220);
      ellipse(ctx, pos[0], pos[1], 38, 38, pos[2]);
      for (let i = 0; i < 4; i++) {
        const x = ((i * 290 + t * (8 + i * 2)) % (W + 240)) - 120, y = 60 + i * 38 + (i % 2) * 20;
        ctx.fillStyle = time === 'dusk' ? 'rgba(255,220,220,.7)' : 'rgba(255,255,255,.85)';
        [[0, 0, 34], [30, -12, 28], [58, 0, 30], [28, 8, 30]].forEach(c => { ctx.beginPath(); ctx.arc(x + c[0], y + c[1], c[2], 0, TAU); ctx.fill(); });
      }
    }
  }
  function hills(ctx, color, base, amp, seed, t) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, base - amp * (0.6 + 0.4 * Math.sin(x / 140 + seed)) - amp * 0.3 * Math.sin(x / 60 + seed * 2));
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }
  function ground(ctx, top, bottom) {
    const g = ctx.createLinearGradient(0, GROUND - 10, 0, H); g.addColorStop(0, top); g.addColorStop(1, bottom);
    ctx.fillStyle = g; ctx.fillRect(0, GROUND - 6, W, H - GROUND + 6);
  }
  function tree(ctx, x, base, s, leaf, sway) {
    ctx.fillStyle = '#7A5236'; ctx.fillRect(x - 7 * s, base - 70 * s, 14 * s, 70 * s);
    const o = Math.sin(sway) * 3 * s;
    [[0, -95, 42], [-28, -75, 32], [28, -75, 32], [0, -130, 32]].forEach(c => ellipse(ctx, x + c[0] * s + o, base + c[1] * s, c[2] * s, c[2] * s, leaf));
  }
  function palm(ctx, x, base, t) {
    ctx.strokeStyle = '#8B6A43'; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, base); ctx.quadraticCurveTo(x + 30, base - 100, x + 10, base - 190); ctx.stroke();
    ctx.strokeStyle = '#3E8E5B'; ctx.lineWidth = 9;
    for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + Math.sin(t) * 0.05; ctx.beginPath(); ctx.moveTo(x + 10, base - 190); ctx.quadraticCurveTo(x + 10 + Math.cos(a) * 50, base - 220, x + 10 + Math.cos(a) * 85, base - 170 + Math.abs(Math.sin(a)) * 10); ctx.stroke(); }
  }
  function house(ctx, x, base, w, h, wall, roof, night) {
    ctx.fillStyle = wall; ctx.fillRect(x, base - h, w, h);
    ctx.fillStyle = roof; ctx.beginPath(); ctx.moveTo(x - 12, base - h); ctx.lineTo(x + w / 2, base - h - w * 0.45); ctx.lineTo(x + w + 12, base - h); ctx.fill();
    ctx.fillStyle = '#7A5236'; ctx.fillRect(x + w * 0.4, base - h * 0.55, w * 0.2, h * 0.55);
    ctx.fillStyle = night ? '#FFD86B' : '#BFE4F7'; ctx.fillRect(x + w * 0.1, base - h * 0.75, w * 0.2, h * 0.25); ctx.fillRect(x + w * 0.7, base - h * 0.75, w * 0.2, h * 0.25);
  }
  function flowers(ctx, r, n, y0, y1) {
    for (let i = 0; i < n; i++) { const x = r() * W, y = y0 + r() * (y1 - y0); const c = ['#F28FB1', '#FFD166', '#FFFFFF', '#C3A6FF'][i % 4]; ctx.fillStyle = c; for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(x + Math.cos(k * 1.26) * 4, y + Math.sin(k * 1.26) * 4, 3.4, 0, TAU); ctx.fill(); } ellipse(ctx, x, y, 2.5, 2.5, '#F4A261'); }
  }

  function drawBackground(ctx, scene, idx, t) {
    const time = scene.setting === 'space' ? 'night' : scene.time;
    const night = time === 'night';
    const r = rng(idx * 97 + hashStr(scene.setting));
    if (scene.setting === 'room') return drawRoom(ctx, time, t, r);
    if (scene.setting === 'space') {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#05060F'); g.addColorStop(1, '#1B1840'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 160; i++) { ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.7 * Math.abs(Math.sin(t + i * 3.1))})`; ctx.fillRect(r() * W, r() * H, 2, 2); }
      ellipse(ctx, 200, 140, 60, 60, '#E9A178'); ctx.strokeStyle = 'rgba(255,230,200,.7)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(200, 140, 105, 22, -0.3, 0, TAU); ctx.stroke();
      ellipse(ctx, 780, 90, 26, 26, '#7FB8E8');
      ground(ctx, '#B9B4C7', '#8C879B');
      for (let i = 0; i < 9; i++) ellipse(ctx, r() * W, GROUND + 15 + r() * 80, 20 + r() * 25, 6 + r() * 6, 'rgba(90,85,110,.35)');
      return;
    }
    drawSky(ctx, time, t);
    const s = scene.setting;
    if (s === 'mountain') {
      [[150, 260, '#7D8FB3'], [470, 200, '#6A7CA3'], [780, 250, '#8396BB']].forEach(m => {
        ctx.fillStyle = m[2]; ctx.beginPath(); ctx.moveTo(m[0] - 260, GROUND); ctx.lineTo(m[0], m[1] - 40); ctx.lineTo(m[0] + 260, GROUND); ctx.fill();
        ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.moveTo(m[0] - 55, m[1] + 5); ctx.lineTo(m[0], m[1] - 40); ctx.lineTo(m[0] + 55, m[1] + 5); ctx.lineTo(m[0] + 20, m[1] - 5); ctx.lineTo(m[0], m[1] + 10); ctx.lineTo(m[0] - 20, m[1] - 5); ctx.fill();
      });
      hills(ctx, '#7DB46C', GROUND + 4, 30, 2, t); ground(ctx, '#86C06F', '#5E9A50');
    } else if (s === 'beach') {
      const sea = ctx.createLinearGradient(0, GROUND - 130, 0, GROUND); sea.addColorStop(0, '#3D8FC4'); sea.addColorStop(1, '#6EC3E0');
      ctx.fillStyle = sea; ctx.fillRect(0, GROUND - 130, W, 130);
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3;
      for (let row = 0; row < 4; row++) { ctx.beginPath(); for (let x = 0; x <= W; x += 10) ctx.lineTo(x, GROUND - 110 + row * 28 + Math.sin(x / 40 + t * 2 + row) * 4); ctx.stroke(); }
      ground(ctx, '#F2D9A6', '#E2C084'); palm(ctx, 70, GROUND + 10, t); palm(ctx, W - 90, GROUND + 20, t + 1);
    } else if (s === 'city') {
      for (let i = 0; i < 12; i++) { const bw = 70 + r() * 40, bh = 120 + r() * 160, x = i * 85 - 20; ctx.fillStyle = night ? '#2D3557' : '#A9B6CC'; ctx.fillRect(x, GROUND - bh - 40, bw, bh + 40); }
      for (let i = 0; i < 8; i++) {
        const bw = 90 + r() * 30, bh = 110 + r() * 120, x = i * 125 - 10; ctx.fillStyle = night ? '#3E4874' : ['#E8B4A0', '#9FC5B8', '#E9D29A', '#B8A9D9'][i % 4]; ctx.fillRect(x, GROUND - bh, bw, bh);
        for (let wy = GROUND - bh + 14; wy < GROUND - 24; wy += 28) for (let wx = x + 12; wx < x + bw - 16; wx += 24) { ctx.fillStyle = night ? (r() > 0.4 ? '#FFD86B' : '#1E2440') : 'rgba(255,255,255,.75)'; ctx.fillRect(wx, wy, 12, 14); }
      }
      ground(ctx, '#7D7F8C', '#5F616C'); ctx.fillStyle = '#F4F4F4'; for (let x = 0; x < W; x += 80) ctx.fillRect(x + ((t * 20) % 80) * 0, GROUND + 50, 40, 5);
    } else if (s === 'school') {
      hills(ctx, '#9CCB86', GROUND - 20, 30, 1, t);
      const bx = W / 2 - 230; ctx.fillStyle = '#F3E3C3'; ctx.fillRect(bx, GROUND - 190, 460, 190);
      ctx.fillStyle = '#C8553D'; ctx.beginPath(); ctx.moveTo(bx - 20, GROUND - 190); ctx.lineTo(W / 2, GROUND - 270); ctx.lineTo(bx + 480, GROUND - 190); ctx.fill();
      for (let i = 0; i < 6; i++) { ctx.fillStyle = night ? '#FFD86B' : '#BFE4F7'; ctx.fillRect(bx + 25 + i * 72, GROUND - 160, 46, 40); }
      ctx.fillStyle = '#7A5236'; ctx.fillRect(W / 2 - 28, GROUND - 90, 56, 90);
      ctx.fillStyle = '#9A9A9A'; ctx.fillRect(110, GROUND - 260, 6, 260);
      for (let k = 0; k < 2; k++) { ctx.fillStyle = k ? '#FFFFFF' : '#E63946'; ctx.beginPath(); for (let x = 0; x <= 80; x += 8) ctx.lineTo(116 + x, GROUND - 258 + k * 22 + Math.sin(x / 15 - t * 5) * 5); for (let x = 80; x >= 0; x -= 8) ctx.lineTo(116 + x, GROUND - 236 + k * 22 + Math.sin(x / 15 - t * 5) * 5); ctx.fill(); }
      ground(ctx, '#8CC47A', '#64A057');
    } else if (s === 'village') {
      hills(ctx, '#8DBF7A', GROUND - 40, 40, 3, t);
      house(ctx, 70, GROUND, 150, 100, '#EAD7B7', '#A0522D', night); house(ctx, W - 230, GROUND, 160, 110, '#F1E2C6', '#8B4513', night);
      palm(ctx, W / 2 + 230, GROUND - 5, t);
      ground(ctx, '#A6CF73', '#7DAA4E');
      ctx.strokeStyle = 'rgba(70,120,40,.35)'; ctx.lineWidth = 2; for (let y = GROUND + 20; y < H; y += 18) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y + 6); ctx.stroke(); }
    } else if (s === 'forest') {
      hills(ctx, '#5E9C6A', GROUND - 60, 50, 4, t);
      for (let i = 0; i < 10; i++) tree(ctx, 40 + i * 98 + r() * 30, GROUND - 25, 0.8 + r() * 0.3, '#3F7F55', t + i);
      ground(ctx, '#6FAF62', '#4E8A47');
      tree(ctx, 30, GROUND + 30, 1.4, '#2F6B45', t); tree(ctx, W - 30, GROUND + 35, 1.5, '#2F6B45', t + 2);
      flowers(ctx, r, 18, GROUND + 15, H - 10);
    } else if (s === 'park') {
      hills(ctx, '#9ACD8A', GROUND - 30, 35, 5, t);
      tree(ctx, 120, GROUND, 1.2, '#4E9A5E', t); tree(ctx, W - 130, GROUND, 1.1, '#5BAA68', t + 1);
      ground(ctx, '#90CB7C', '#6AA95A');
      ctx.fillStyle = '#E9D8B4'; ctx.beginPath(); ctx.moveTo(W / 2 - 40, GROUND); ctx.lineTo(W / 2 + 40, GROUND); ctx.lineTo(W / 2 + 160, H); ctx.lineTo(W / 2 - 160, H); ctx.fill();
      ctx.fillStyle = '#8B5E3C'; ctx.fillRect(W - 300, GROUND - 40, 110, 10); ctx.fillRect(W - 300, GROUND - 22, 110, 8); ctx.fillRect(W - 292, GROUND - 30, 6, 30); ctx.fillRect(W - 204, GROUND - 30, 6, 30);
      flowers(ctx, r, 30, GROUND + 10, H - 10);
    } else {
      hills(ctx, '#A6D58F', GROUND - 40, 40, 6, t); hills(ctx, '#8BC67A', GROUND - 5, 25, 9, t);
      ground(ctx, '#92CC7D', '#6DAA5D'); flowers(ctx, r, 24, GROUND + 10, H - 10);
    }
    if (night) { ctx.fillStyle = 'rgba(10,20,55,.32)'; ctx.fillRect(0, 0, W, H); }
    else if (time === 'dusk') { ctx.fillStyle = 'rgba(120,60,90,.12)'; ctx.fillRect(0, 0, W, H); }
  }

  function drawRoom(ctx, time, t, r) {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND); g.addColorStop(0, '#F6E7D3'); g.addColorStop(1, '#EED7BC'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND);
    ctx.save(); rr(ctx, 600, 70, 220, 170, 10); ctx.clip(); drawSky(ctx, time, t); ctx.restore();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 10; rr(ctx, 600, 70, 220, 170, 10); ctx.stroke(); ctx.beginPath(); ctx.moveTo(710, 70); ctx.lineTo(710, 240); ctx.moveTo(600, 155); ctx.lineTo(820, 155); ctx.stroke();
    ctx.fillStyle = '#D98E73'; ctx.fillRect(590, 60, 30, 200); ctx.fillRect(800, 60, 30, 200);
    ctx.fillStyle = '#C9A27E'; ctx.fillRect(130, 90, 130, 100); ctx.fillStyle = '#9DD3C8'; ctx.fillRect(142, 102, 106, 76); ellipse(ctx, 195, 150, 22, 14, '#F2C14E');
    ctx.fillStyle = '#E2B07E'; ctx.fillRect(0, GROUND - 6, W, H);
    ctx.strokeStyle = 'rgba(120,80,50,.25)'; ctx.lineWidth = 2; for (let x = 0; x < W; x += 70) { ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x - 40, H); ctx.stroke(); }
    ellipse(ctx, W / 2, GROUND + 55, 300, 34, 'rgba(129,178,154,.55)');
    ctx.fillStyle = '#6B4A35'; ctx.fillRect(60, GROUND - 120, 8, 120); ellipse(ctx, 64, GROUND - 130, 34, 22, time === 'night' ? '#FFE08A' : '#F5D6A8');
    if (time === 'night') { ctx.fillStyle = 'rgba(20,20,60,.25)'; ctx.fillRect(0, 0, W, H); const lg = ctx.createRadialGradient(64, GROUND - 130, 5, 64, GROUND - 130, 220); lg.addColorStop(0, 'rgba(255,220,140,.45)'); lg.addColorStop(1, 'rgba(255,220,140,0)'); ctx.fillStyle = lg; ctx.fillRect(0, 0, 400, H); }
  }

  const SETTING_ID = { meadow: 'padang', forest: 'hutan', beach: 'pantai', mountain: 'gunung', city: 'kota', school: 'sekolah', village: 'desa', room: 'rumah', park: 'taman', space: 'angkasa' };
  /** Latar dari foto: memenuhi layar, perlahan mendekat agar terasa hidup. */
  function drawPhotoBackground(ctx, img, scene, st) {
    const zoom = 1.03 + Math.min(st, 20) * 0.004;
    const k = Math.max(W / img.width, H / img.height) * zoom, w = img.width * k, h = img.height * k;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(img, (W - w) / 2 - Math.sin(st * 0.15) * 10, (H - h) / 2, w, h);
    const g = ctx.createLinearGradient(0, GROUND - 60, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.28)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (scene.time === 'night') { ctx.fillStyle = 'rgba(10,20,55,.35)'; ctx.fillRect(0, 0, W, H); }
    else if (scene.time === 'dusk') { ctx.fillStyle = 'rgba(160,80,60,.15)'; ctx.fillRect(0, 0, W, H); }
  }

  function drawWeather(ctx, weather, t) {
    if (weather === 'rain') {
      ctx.fillStyle = 'rgba(40,60,90,.18)'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(200,220,255,.6)'; ctx.lineWidth = 2; ctx.beginPath();
      for (let i = 0; i < 120; i++) { const x = (i * 73 + t * 60) % W, y = (i * 131 + t * 700) % H; ctx.moveTo(x, y); ctx.lineTo(x - 6, y + 18); }
      ctx.stroke();
    } else if (weather === 'snow') {
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      for (let i = 0; i < 90; i++) { const x = (i * 97 + Math.sin(t + i) * 20 + t * 15) % W, y = (i * 53 + t * 50) % H; ctx.beginPath(); ctx.arc(x, y, 2 + (i % 3), 0, TAU); ctx.fill(); }
    }
  }

  /* ----------------------------- KARAKTER ----------------------------- */
  function drawCharacter(ctx, ch, o) {
    // o: {x, y, s, face, look, emotion, action, talking, t}
    const t = o.t, e = o.emotion, a = o.action;
    let lift = 0, rot = 0, legSwing = 0, lean = 0;
    if (a === 'walk') legSwing = Math.sin(t * 7) * 0.45;
    if (a === 'run') { legSwing = Math.sin(t * 13) * 0.8; lean = 0.12; lift = Math.abs(Math.sin(t * 13)) * 6; }
    if (a === 'jump') lift = Math.abs(Math.sin(t * 3.2)) * 70;
    if (a === 'dance') { lift = Math.abs(Math.sin(t * 6)) * 14; rot = Math.sin(t * 4) * 0.18; legSwing = Math.sin(t * 6) * 0.3; }
    if (o.talking) lift += Math.abs(Math.sin(t * 9)) * 3;
    const breathe = 1 + Math.sin(t * 2.2) * 0.012;
    const tremble = e === 'scared' ? Math.sin(t * 50) * 1.5 : 0;

    ctx.save(); ctx.translate(o.x, o.y);
    ellipse(ctx, 0, 0, 46 * o.s * (1 - lift / 200), 10 * o.s, 'rgba(0,0,0,.16)');
    ctx.scale(o.s, o.s);

    if (a === 'sleep') {
      ctx.rotate(-Math.PI / 2); ctx.translate(-30, -40);
    } else if (a === 'sit') {
      ctx.fillStyle = '#B08968'; rr(ctx, -50, -38, 100, 38, 8); ctx.fill(); ctx.translate(0, -28);
    }
    ctx.translate(tremble, -lift); ctx.rotate(rot + lean * o.face); ctx.scale(o.face * breathe, 2 - breathe);

    const body = ch.color || '#FF8A65', skin = SKINS[(ch.skin || 0) % SKINS.length], hair = HAIR[(ch.index || 0) % HAIR.length];
    // kaki
    ctx.strokeStyle = shade(body, -0.35); ctx.lineWidth = 13; ctx.lineCap = 'round';
    [[-14, legSwing], [14, -legSwing]].forEach(l => {
      ctx.beginPath(); ctx.moveTo(l[0], -50);
      if (a === 'sit') ctx.lineTo(l[0] + 26, -6); else ctx.lineTo(l[0] + Math.sin(l[1]) * 34, -50 + Math.cos(l[1]) * 48);
      ctx.stroke();
    });
    // badan
    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, -88, 38, 46, 0, 0, TAU); ctx.fill();
    ellipse(ctx, 0, -78, 22, 26, shade(body, 0.12));
    // lengan
    ctx.strokeStyle = shade(body, -0.12); ctx.lineWidth = 11;
    const arm = (side, hx, hy) => { ctx.beginPath(); ctx.moveTo(side * 30, -108); ctx.quadraticCurveTo(side * 44, (hy - 108) / 2 - 100, hx, hy); ctx.stroke(); ellipse(ctx, hx, hy, 7, 7, skin); };
    let lh = [-46, -62], rh = [46, -62];
    if (a === 'wave') rh = [52 + Math.sin(t * 9) * 14, -170];
    if (a === 'dance') { lh = [-56, -160 + Math.sin(t * 6) * 20]; rh = [56, -160 - Math.sin(t * 6) * 20]; }
    if (a === 'run') { lh = [-30 - Math.sin(t * 13) * 25, -80]; rh = [30 + Math.sin(t * 13) * 25, -80]; }
    if (a === 'walk') { lh = [-44 - Math.sin(t * 7) * 10, -62]; rh = [44 + Math.sin(t * 7) * 10, -62]; }

    draw() {
      const ctx = this.ctx;
      if (!this.segs || !this.segs.length) { ctx.fillStyle = '#1d1b26'; ctx.fillRect(0, 0, W, H); return; }
      const seg = this.segs[this.segAt(this.t)], into = this.t - seg.start;
      if (seg.type === 'title') return this.drawTitle(into);
      if (seg.type === 'end') return this.drawEnd(into);
      const scene = this.story.scenes[seg.scene], st = this.t - this.sceneStart[seg.scene];
      const photoBg = this.bgPhotoFor(scene, seg.scene);
      if (photoBg) drawPhotoBackground(ctx, photoBg, scene, st); else drawBackground(ctx, scene, seg.scene, this.t);
      this.drawCast(scene, seg, st, into);
      if (scene.setting !== 'room') drawWeather(ctx, scene.weather, this.t);
      // fade antar adegan
      const fade = Math.min(1, st / 0.45, (this.sceneEnd[seg.scene] - this.t) / 0.35);
      if (fade < 1) { ctx.fillStyle = `rgba(22,18,32,${1 - fade})`; ctx.fillRect(0, 0, W, H); }
      if (this.showText && this.meta.title) {
        ctx.save(); ctx.font = '700 14px Nunito, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 4;
        ctx.fillText(this.meta.title + (this.meta.animator ? '  ·  ' + this.meta.animator : ''), 18, 26); ctx.restore();
      }
    }
    drawCast(scene, seg, st, into) {
      const ctx = this.ctx, list = scene.characters || [], n = list.length;
      const speaker = seg.type === 'dialogue' ? seg.speaker : null;
      const s = n >= 4 ? 0.82 : n === 3 ? 0.92 : 1;
      const pos = list.map((c, i) => W * (i + 1) / (n + 1));
      const speakerIdx = list.findIndex(c => c.name === speaker);
      let head = null;
      list.forEach((c, i) => {
        const base = this.chars[c.name] || { name: c.name, color: '#FFB703', index: i };
        let x = pos[i];
        if (c.action === 'walk') x += Math.sin(st * 0.8 + i) * 40;
        if (c.action === 'run') x += Math.sin(st * 1.6 + i) * 80;
        const vel = c.action === 'walk' ? Math.cos(st * 0.8 + i) : c.action === 'run' ? Math.cos(st * 1.6 + i) : 0;
        const target = speakerIdx >= 0 && speakerIdx !== i ? pos[speakerIdx] : W / 2;
        const face = vel ? Math.sign(vel) : (target >= x ? 1 : -1);
        const talking = c.name === speaker;
        if (talking) ellipse(ctx, x, GROUND + 35, 70 * s, 16 * s, 'rgba(255,240,180,.45)');
        const h = drawCharacter(ctx, base, { x, y: GROUND + 35, s, face, look: (target - x) / 200, emotion: c.emotion, action: c.action, talking, t: this.t + i * 0.7, photo: this.photoFor(c.name), label: this.showText });
        if (talking) head = h;
      });
      if (!this.showText) return;
      if (seg.type === 'narration' && seg.text) caption(ctx, seg.text);
      if (seg.type === 'dialogue') {
        if (head) bubble(ctx, seg.text, head.headX, head.headY, into);
        else caption(ctx, seg.text, seg.speaker);
      }
    }
    drawTitle(into) {
      const ctx = this.ctx, sc = this.story.scenes[0];
      if (sc) drawBackground(ctx, sc, 0, this.t); else { ctx.fillStyle = '#2B2A33'; ctx.fillRect(0, 0, W, H); }
      const a = Math.min(1, into / 0.8);
      ctx.fillStyle = 'rgba(28,22,40,.62)'; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.textAlign = 'center'; ctx.globalAlpha = a; ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 18px Nunito, sans-serif'; ctx.fillStyle = '#F4C095';
      ctx.fillText(((this.meta.seriesTitle || '') + (this.meta.episodeLabel ? '  ·  ' + this.meta.episodeLabel : '')).toUpperCase(), W / 2, H / 2 - 70);
      ctx.fillStyle = '#FFFFFF'; ctx.font = '800 54px Nunito, sans-serif';
      wrap(ctx, this.meta.title || 'Cerita Tanpa Judul', W - 160).slice(0, 2).forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + i * 60 - (8 - 20 * (1 - a))));
      ctx.font = '600 22px Nunito, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)';
      if (this.meta.animator) ctx.fillText('Karya ' + this.meta.animator, W / 2, H / 2 + 100);
      ctx.restore();
    }
    drawEnd(into) {
      const ctx = this.ctx, a = Math.min(1, into / 0.8);
      const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#2B2340'); g.addColorStop(1, '#5A3A4E');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 40; i++) { ctx.fillStyle = `rgba(255,230,200,${0.3 * Math.abs(Math.sin(this.t + i))})`; ctx.beginPath(); ctx.arc((i * 211) % W, (i * 97) % H, 2, 0, TAU); ctx.fill(); }
      ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 58px Nunito, sans-serif'; ctx.fillText(this.meta.hasNext ? 'Bersambung…' : 'Tamat', W / 2, H / 2 - 20);
      ctx.font = '600 22px Nunito, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)';
      if (this.meta.animator) ctx.fillText('Animasi oleh ' + this.meta.animator, W / 2, H / 2 + 34);
      ctx.font = '600 16px Nunito, sans-serif'; ctx.fillStyle = '#F4C095'; ctx.fillText('Dibuat dengan Studio Cerita', W / 2, H / 2 + 74);
      ctx.restore();
    }
  }

  /** Sampul statis untuk kartu galeri. */
  function drawCover(canvas, seed, title) {
    const ctx = canvas.getContext('2d'), sx = canvas.width / W, r = rng(hashStr(seed));
    const settings = ['meadow', 'forest', 'beach', 'mountain', 'city', 'school', 'village', 'park', 'space', 'room'];
    const times = ['day', 'morning', 'dusk', 'night'];
    const scene = { setting: settings[Math.floor(r() * settings.length)], time: times[Math.floor(r() * 4)], weather: 'clear' };
    ctx.save(); ctx.scale(sx, canvas.height / H);
    drawBackground(ctx, scene, 1, 3);
    const emos = ['happy', 'love', 'surprised', 'neutral'];
    [0, 1].forEach(i => drawCharacter(ctx, { name: '', color: ['#FF8A65', '#4FC3F7', '#AED581', '#BA68C8', '#FFD54F'][Math.floor(r() * 5)], skin: Math.floor(r() * 5), index: i },
      { x: W * (i ? 0.62 : 0.38), y: GROUND + 35, s: 1.15, face: i ? -1 : 1, look: i ? -1 : 1, emotion: emos[Math.floor(r() * 4)], action: i ? 'wave' : 'idle', talking: false, t: 1.3 + i }));
    ctx.restore();
  }

  global.StudioRenderer = { Animator, drawCover, readTime, W, H };
})(window);
</script>
